[project]
name = "pdf-tools"
version = "0.1.0"
description = ""
authors = [
    {name = "Y1teng",email = "to.hitakiti@gmail.com~"}
]
requires-python = ">=3.12,<4.0"
dependencies = [
    "docling (>=2.117.0,<3.0.0)",
    "torch",
    "torchvision"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
